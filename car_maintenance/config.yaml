name: Car Maintenance
version: "1.0.0"
slug: car_maintenance
description: Fuel, services, reminders, faults, trips and costs for your cars.
url: https://github.com/aziz-011/car_maintenace
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
# Opens inside Home Assistant (sidebar, companion app), behind its login.
ingress: true
ingress_port: 8080
panel_icon: mdi:car-wrench
panel_title: Car Maintenance
# Optional direct address on the home network, for the calendar feed, email links
# and phone shortcuts. Like the PC version it has no password: remove the port in
# the add-on's Network settings if you only want access through Home Assistant.
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Direct access on the home network (calendar feed, email links)
# The data lives in the add-on's own folder in /addon_configs, so it is in
# Home Assistant backups and can be reached with the Samba or File editor add-ons.
map:
  - type: addon_config
    read_only: false
options:
  app_url: ""
schema:
  app_url: url?
