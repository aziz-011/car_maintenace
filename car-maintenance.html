 d’e-mails.","This single-file version keeps its data in this browser only, so it cannot be shared. Use the home server to share it with your family.":"Cette version en un seul fichier garde ses données dans ce navigateur uniquement : elle ne peut pas être partagée. Utilisez le serveur de la maison pour la partager avec votre famille.","Tire pressure":"Pression des pneus",To:"À","To import from Excel, save the sheet as CSV first. Columns are recognised by name in English or French (Date, Kilométrage, Litres, Prix/L, Montant, Station…), with either decimal style. Rows already logged are skipped.":"Pour importer depuis Excel, enregistrez d’abord la feuille en CSV. Les colonnes sont reconnues par leur nom en français ou en anglais (Date, Kilométrage, Litres, Prix/L, Montant, Station…), avec virgule ou point décimal. Les lignes déjà notées sont ignorées.",Trip:"Trajet",Trips:"Trajets","Used for the spending forecast. Left empty, the cost of the last service of this type is used.":"Utilisé pour la prévision des dépenses. Vide, c’est le coût du dernier entretien de ce type qui compte.","Usual cost (optional)":"Coût habituel (facultatif)",Vibration:"Vibration","Warn when a tank uses more fuel than usual":"Prévenir quand un plein consomme plus que d’habitude","Warning light":"Voyant","What happens":"Ce qui se passe","When it happens: cold start, braking, at speed…":"Quand ça arrive : démarrage à froid, freinage, à haute vitesse…",'When you add a fill-up, tap "Fill in from a receipt photo": Claude reads the liters, price, total, station and date from the photo. You are asked once to allow the page to send images to Claude. Always check the values before saving.':"Quand vous ajoutez un plein, touchez « Remplir depuis une photo du ticket » : Claude lit les litres, le prix, le total, la station et la date sur la photo. On vous demande une fois d’autoriser la page à envoyer des images à Claude. Vérifiez toujours les valeurs avant d’enregistrer.","Which light":"Quel voyant",Work:
